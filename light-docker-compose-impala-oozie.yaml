services:
# Environnement hadoop #
  namenode:
    image: mrugankray/namenode-spark-airflow-flume-zepplin:1.1
    container_name: namenode
    restart: always
    ports:
      - 9870:9870
      - 9000:9000
      - 8082:8082 # zeppelin ui
      - 8080:8080 # spark master web ui
      - 8081:8081 # spark slave web ui
      - 4040:4040 # spark driver web ui
      - 3000:3000 # airflow ui
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - hadoop_namenode_conda:/root/anaconda
      - hadoop_namenode_spark:/opt/spark
      - hadoop_namenode_zeppelin:/opt/zeppelin
      - ./configs/zeppelin-site.xml:/opt/zeppelin/conf/zeppelin-site.xml
      - ./configs/zeppelin-env.sh:/opt/zeppelin/conf/zeppelin-env.sh
      - ./configs/namenode_bashrc.txt:/root/.bashrc
      - ./configs/namenode_airflow.cfg:/root/airflow/airflow.cfg
      - ./dags:/root/airflow/dags
      - airflow_namenode:/root/airflow
      - ./configs/namenode/flume/flume-env.sh:/opt/flume/conf/flume-env.sh
      - ./flume_config/flume.conf:/opt/flume/conf/flume.conf
      - hadoop_namenode_flume:/opt/flume
    environment:
      - CLUSTER_NAME=hadoop-learning
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    env_file:
      - ./hadoop.env

  datanode:
    image: mrugankray/datanode-python:1.0
    container_name: datanode
    restart: always
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      - hadoop_datanode_conda:/root/anaconda
      - ./configs/datanode_bashrc.txt:/root/.bashrc
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: "hdfs://namenode:9000"
    ports:
      - "9864:9864"
    env_file:
      - ./hadoop.env

  resourcemanager:
    image: mrugankray/resourcemanager-python:1.0
    container_name: resourcemanager
    restart: always
    volumes:
      - hadoop_resourcemanager_conda:/root/anaconda
      - ./configs/resourcemanager_bashrc.txt:/root/.bashrc
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864"
    ports:
      - "8088:8088"
    env_file:
      - ./hadoop.env

  nodemanager:
    image: mrugankray/nodemanager-python:1.0
    container_name: nodemanager
    restart: always
    volumes:
      - hadoop_nodemanager_conda:/root/anaconda
      - ./configs/nodemanager_bashrc.txt:/root/.bashrc
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    ports:
      - "8042:8042"
      - "19888:19888" # to access job history
    env_file:
      - ./hadoop.env

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: always
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088"
    ports:
      - "8188:8188"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    env_file:
      - ./hadoop.env

# Environnement zookeeper #
  zookeeper:
    image: confluentinc/cp-zookeeper:5.4.0
    hostname: zookeeper
    container_name: zookeeper
    depends_on:
      - namenode
      - datanode
      - resourcemanager
      - nodemanager
      - historyserver
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

# Environnement Hive #
  hive-server:
    image: mrugankray/hive-server-sqoop:1.0
    container_name: hive-server
    depends_on:
      - namenode
      - datanode
      - hive-metastore
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop_hive_server_sqoop:/usr/lib/sqoop
      - ./configs/hive_server/sqoop-env.sh:/usr/lib/sqloop/conf/sqoop-env.sh
      - ./configs/hive_server/hive_server_bashrc.txt:/root/.bashrc
      - ./configs/hive_server/sqoop-site.xml:/usr/lib/sqoop/conf/sqoop-site.xml
      - ./configs/hive_server/sshd_config.conf:/etc/ssh/sshd_config
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - 10000:10000

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - ./hadoop.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 hive-metastore-postgresql:5432"
    ports:
      - "9083:9083"
    depends_on:
      - hive-metastore-postgresql

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql

# Environnement Hue #
  huedb:
    image: postgres:15.1-alpine3.17
    container_name: huedb
    volumes:
      - hue_pg_data:/var/lib/postgresl/data/
    env_file:
      - ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 hive-metastore-postgresql:5432 hive-metastore:9083 hive-server:10000 resourcemanager:8088"
      POSTGRES_USER: hue
      POSTGRES_PASSWORD: hue
      POSTGRES_DB: hue

  hue:
    image: gethue/hue:4.6.0
    container_name: hue
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 hive-metastore-postgresql:5432 hive-metastore:9083 hive-server:10000 resourcemanager:8088"
    ports:
      - "8888:8888"
    env_file:
      - ./hadoop.env
    volumes:
      - ./hue-overrides.ini:/usr/share/hue/desktop/conf/hue-overrides.ini
    depends_on:
      - huedb

# Environnement SGBD PostGreSQL & pgadmin #
  external_postgres_db:
    image: postgres:15.1-alpine3.17
    container_name: external_postgres_db
    volumes:
      - external_postgres_db_data:/var/lib/postgresl/data/
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: external
      POSTGRES_PASSWORD: external
      POSTGRES_DB: external
  
  external_pgadmin:
    image: dpage/pgadmin4:6.18
    container_name: external_pgadmin
    ports:
      - "5000:80"
    environment:
      - "PGADMIN_DEFAULT_EMAIL=pgadmin@xyz.com"
      - "PGADMIN_DEFAULT_PASSWORD=external"
    depends_on:
      - external_postgres_db

# Environnement Impala #
  impala:
    image: apache/kudu:impala-latest
    container_name: impala
    hostname: impala
    restart: always
    ports:
      - "25000:25000"  # Interface web Impala
      - "21000:21000"  # Port Beeswax (JDBC)
      - "21050:21050"  # Port HS2 HTTP
      - "25010:25010"
      - "25020:25020"
    environment:
      - IMPALA_CATALOG_SERVICE_HOST=impala
      - IMPALA_STATE_STORE_HOST=impala
      - HIVE_METASTORE_URI=thrift://hive-metastore:9083
      - NAMENODE_URI=hdfs://namenode:9000
      - POSTGRES_USER=external
      - POSTGRES_PASSWORD=external
      - POSTGRES_PASSWORD=external
      - POSTGRES_DB=external
    env_file:
      - ./hadoop.env
    volumes:
      - ./configs/impala:/etc/impala/conf
      - hadoop_namenode:/hadoop/dfs/name
    depends_on:
      - hive-metastore
      - hive-server
      - namenode
      - datanode
    command: [ "impala" ]

# Environnement Apache Oozie #
  oozie:
    image: equemuelcompellon/hadoop-oozie:latest
    container_name: oozie
    hostname: oozie
    restart: always
    ports:
      - "11000:11000"  # Oozie Web Console
      - "11001:11001"  # Administration Oozie
    environment:
      SERVICE_PRECONDITION: "namenode:9000 namenode:9870 datanode:9864 resourcemanager:8088 hive-metastore:9083"
      OOZIE_HTTP_HOSTNAME: oozie
      OOZIE_HTTP_PORT: 11000
      OOZIE_BASE_URL: http://oozie:11000/oozie
      # Hadoop configuration
      FS_defaultFS: hdfs://namenode:9000
      FS_DEFAULTFS: hdfs://namenode:9000
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      YARN_CONF_yarn_resourcemanager_hostname: resourcemanager
      YARN_CONF_yarn_resourcemanager_address: resourcemanager:8032
      YARN_CONF_yarn_resourcemanager_scheduler_address: resourcemanager:8030
      YARN_CONF_yarn_resourcemanager_resource__tracker_address: resourcemanager:8031
      # Database configuration (using external PostgreSQL)
      OOZIE_DB_TYPE: postgres
      OOZIE_DB_HOST: external_postgres_db
      OOZIE_DB_PORT: 5432
      OOZIE_DB_NAME: oozie
      OOZIE_DB_USER: oozie
      OOZIE_DB_PASSWORD: oozie
    env_file:
      - ./hadoop.env
    volumes:
      - oozie_data:/opt/oozie/data
      - ./configs/oozie:/opt/oozie/conf
      - ./oozie-workflows:/opt/oozie/workflows  # Mount for workflow definitions
      - hadoop_namenode:/hadoop/dfs/name:ro
    depends_on:
      - namenode
      - datanode
      - resourcemanager
      - nodemanager
      - historyserver
      - hive-metastore
      - external_postgres_db
    command: >
      bash -c "
        # Wait for dependencies to be ready
        #/wait-for-it.sh namenode:9000 --timeout=300 --strict -- 
        #/wait-for-it.sh resourcemanager:8088 --timeout=300 --strict --
        #/wait-for-it.sh external_postgres_db:5432 --timeout=300 --strict --
        #while ! nc -z namenode 9000; do sleep 2; done
        #while ! nc -z resourcemanager 8088; do sleep 2; done
        #while ! nc -z external_postgres_db 5432; do sleep 2; done
        sleep 60
        # Initialize Oozie database if needed
        /opt/oozie-4.2.0/bin/ooziedb.sh create -run &&
        # Start Oozie server
        /opt/oozie-4.2.0/bin/oozied.sh run
      "

  # Database initialization for Oozie
  oozie-db-init:
    image: postgres:15.1-alpine3.17
    container_name: oozie-db-init
    environment:
      POSTGRES_USER: external
      POSTGRES_PASSWORD: external
      PGPASSWORD: external
    volumes:
      - ./configs/oozie/init-oozie-db.sql:/docker-entrypoint-initdb.d/init-oozie-db.sql
    depends_on:
      - external_postgres_db
    command: >
      sh -c "
        until pg_isready -h external_postgres_db -p 5432 -U external; do
          echo 'Waiting for PostgreSQL to be ready...'
          sleep 2
        done
        echo 'PostgreSQL is ready, creating Oozie database and user...'
        psql -h external_postgres_db -U external -d external -c \"CREATE DATABASE oozie;\" || true
        psql -h external_postgres_db -U external -d external -c \"CREATE USER oozie WITH PASSWORD 'oozie';\" || true
        psql -h external_postgres_db -U external -d external -c \"GRANT ALL PRIVILEGES ON DATABASE oozie TO oozie;\" || true
        echo 'Oozie database initialization completed'
      "

volumes:
  hadoop_namenode:
  hadoop_namenode_conda:
  hadoop_namenode_spark:
  hadoop_namenode_zeppelin:
  hadoop_namenode_flume:
  hadoop_datanode:
  hadoop_datanode_conda:
  hadoop_resourcemanager_conda:
  hadoop_nodemanager_conda:
  hadoop_historyserver:
  hadoop_hive_server_sqoop:
  hue_pg_data:
  external_postgres_db_data:
  airflow_namenode:
  zookeeper_data:
  zookeeper_log:
  oozie_data:
